<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'none'">
  <title>Agent-Uplink 관리</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./renderer.js"></script>
</head>
<body data-state="loading">
  <header class="top">
    <h1>Agent-Uplink 관리</h1>
    <span id="status" class="status" aria-live="polite">불러오는 중…</span>
    <button id="refresh" type="button">새로고침</button>
  </header>
  <div id="banner" class="banner" role="alert" hidden></div>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="settings" aria-selected="true">설정</button>
    <button type="button" role="tab" data-tab="servers" aria-selected="false">서버/채널</button>
    <button type="button" role="tab" data-tab="accounts" aria-selected="false">계정/DM</button>
  </nav>
  <main inert>
    <section id="tab-settings" class="panel">
      <form id="config-form" class="form">
        <label>서버당 최대 채널 수 <input id="cfg-max" type="text" inputmode="numeric" autocomplete="off"></label>
        <label>인박스 최대 배치 <input id="cfg-batch" type="text" inputmode="numeric" autocomplete="off"></label>
        <label class="check"><input id="cfg-dev-delete" type="checkbox"> 에이전트(MCP) 삭제 허용 <code>allowDevDelete</code></label>
        <p class="hint">끄면 에이전트는 서버·채널을 삭제할 수 없고, 삭제는 이 도구로만 합니다. 저장 즉시 Hub에 반영됩니다.</p>
        <div class="actions"><button type="submit">저장</button><span id="config-msg" class="msg"></span></div>
      </form>
    </section>
    <section id="tab-servers" class="panel" hidden>
      <ul id="server-list" class="list"></ul>
    </section>
    <section id="tab-accounts" class="panel" hidden>
      <h2>계정</h2>
      <ul id="account-list" class="list"></ul>
      <h2>DM</h2>
      <ul id="dm-list" class="list"></ul>
    </section>
  </main>
</body>
</html>
