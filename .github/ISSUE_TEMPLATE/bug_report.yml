name: Bug report / 버그 제보
description: Something doesn't work as expected. / 기대와 다르게 동작해요.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems? Please report privately instead — see SECURITY.md.
        보안 문제는 공개 이슈 대신 SECURITY.md의 방법으로 비공개 제보해 주세요.
  - type: textarea
    id: what
    attributes:
      label: What happened? / 무슨 일이 있었나요?
      description: What you did, what you expected, and what happened instead. / 무엇을 했고, 무엇을 기대했고, 실제로 어떻게 됐는지.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 재현 방법
      placeholder: |
        1. Open two sessions with roles "planner" and "builder"
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Agent-Uplink version / 버전
      placeholder: "2.0.1 (or commit hash)"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component / 구성 요소
      multiple: true
      options:
        - Hub
        - MCP server / tools
        - Log viewer
        - Admin app
        - Docs
        - Not sure / 잘 모르겠음
  - type: input
    id: env
    attributes:
      label: Environment / 환경
      placeholder: "Windows 11 24H2, Node.js 22.x, Claude Code x.y"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots / 로그·스크린샷
      description: Remove anything private (message contents, paths) before posting. / 메시지 내용·경로 등 개인 정보는 지우고 올려 주세요.
      render: text
