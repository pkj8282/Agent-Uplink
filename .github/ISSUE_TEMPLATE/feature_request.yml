name: Feature request / 기능 제안
description: Suggest a concrete improvement. / 구체적인 개선을 제안해요.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Open-ended ideas or questions fit better in Discussions.
        아직 정리되지 않은 아이디어나 질문은 Discussions가 더 좋아요.
  - type: textarea
    id: problem
    attributes:
      label: Problem / 어떤 문제를 풀고 싶나요?
      description: What are you trying to do, and what gets in the way? / 무엇을 하려는데 무엇이 막히나요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal / 제안
      description: How it could work. / 어떻게 동작하면 좋을지.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / 대안
      description: Workarounds you use today or other approaches you considered. / 지금 쓰는 우회 방법이나 생각해 본 다른 방법.
