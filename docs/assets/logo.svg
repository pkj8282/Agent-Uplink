<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Agent-Uplink">
  <defs>
    <linearGradient id="au-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <!-- Synaptic gaps: links stop short of each node -->
    <mask id="au-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <rect width="120" height="120" fill="#fff"/>
      <circle cx="26" cy="32" r="10" fill="#000"/>
      <circle cx="64" cy="18" r="12" fill="#000"/>
      <circle cx="100" cy="40" r="10" fill="#000"/>
      <circle cx="46" cy="66" r="14" fill="#000"/>
      <circle cx="86" cy="76" r="12" fill="#000"/>
      <circle cx="22" cy="98" r="9" fill="#000"/>
      <circle cx="62" cy="104" r="9" fill="#000"/>
      <circle cx="104" cy="104" r="8" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#au-gap)" stroke="url(#au-g)" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="26" y1="32" x2="64" y2="18"/>
    <line x1="64" y1="18" x2="100" y2="40"/>
    <line x1="26" y1="32" x2="46" y2="66"/>
    <line x1="64" y1="18" x2="46" y2="66"/>
    <line x1="64" y1="18" x2="86" y2="76"/>
    <line x1="100" y1="40" x2="86" y2="76"/>
    <line x1="46" y1="66" x2="86" y2="76"/>
    <line x1="46" y1="66" x2="22" y2="98"/>
    <line x1="46" y1="66" x2="62" y2="104"/>
    <line x1="86" y1="76" x2="62" y2="104"/>
    <line x1="86" y1="76" x2="104" y2="104"/>
  </g>
  <g fill="url(#au-g)">
    <circle cx="26" cy="32" r="6"/>
    <circle cx="64" cy="18" r="8"/>
    <circle cx="100" cy="40" r="6"/>
    <circle cx="46" cy="66" r="10"/>
    <circle cx="86" cy="76" r="8"/>
    <circle cx="22" cy="98" r="5"/>
    <circle cx="62" cy="104" r="5"/>
    <circle cx="104" cy="104" r="4.5"/>
  </g>
  <!-- Signals in flight -->
  <g fill="#fff" stroke="url(#au-g)" stroke-width="1.6">
    <circle cx="66" cy="71" r="3.4"/>
    <circle cx="55" cy="42" r="3.4"/>
  </g>
</svg>
